# SuperOpenGym — server block for the VPS's own Nginx. `./deploy.sh init` prints it with
# __DOMAIN__ and __WEB_PORT__ filled in. TLS paths are Let's Encrypt/certbot's defaults; adjust
# them to wherever your certificate for this name really lives.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    # `listen … ssl http2` works on every Nginx; 1.25.1+ prefers a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The whole workout history travels in one PUT /api/data (the app's own nginx allows 5m), and
    # exercise videos up to MEDIA_UPLOAD_MAX (48m by default) — the larger of the two.
    client_max_body_size 48m;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: the API's sign-in throttle and activity log trust these.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The paired phone authenticates with this header; it must reach the API unchanged.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
}
