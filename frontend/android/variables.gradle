ext {
    // 26 (Android 8): the floor androidx.health.connect:connect-client declares; Health Connect itself
    // needs Android 9+ and is checked at runtime (HealthConnectPlugin.status).
    minSdkVersion = 26
    // 36: required to compile against androidx.health.connect:connect-client 1.1.0. The app's
    // behaviour follows targetSdkVersion, which stays at 35.
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    healthConnectVersion = '1.1.0'
    // CameraX for the barcode scanner (@capacitor-mlkit/barcode-scanning reads these). Its default,
    // 1.1.0, ships libimage_processing_util_jni.so with 4 KB LOAD segments, which Android 15+ flags
    // on 16 KB page-size devices; 1.4.2 is built 16 KB-aligned (checked with readelf -l).
    androidxCameraCamera2Version = '1.4.2'
    androidxCameraCoreVersion = '1.4.2'
    androidxCameraLifecycleVersion = '1.4.2'
    androidxCameraViewVersion = '1.4.2'
}